name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./packages/teal-ink/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$package_version."
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install --frozen-lockfile

      - run: bun run ci

      - run: mkdir -p dist

      - name: Pack Vue library
        run: bun pm pack --ignore-scripts --destination ../../dist
        working-directory: packages/teal-ink

      - name: Publish Vue library
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish ./dist/*.tgz --access public --tag "$NPM_DIST_TAG"
